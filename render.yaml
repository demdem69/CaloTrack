services:
  - type: web
    name: calotrack-api
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DB_PORT
        value: "14530"
      - key: DB_NAME
        value: defaultdb
      - key: DB_SSLMODE
        value: require
      - key: CORS_ORIGINS
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false

